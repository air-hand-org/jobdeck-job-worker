version: "2"

linters:
  enable:
    - govet
    - revive
    - testifylint
  exclusions:
    paths:
      - gen/
      - gen_*\.go
    rules:
      - path: _test\.go
        linters:
          - govet
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
      - gen_*\.go
      - _test\.go
