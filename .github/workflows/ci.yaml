name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types: [checks_requested]

permissions: {}

jobs:
  # Add CI jobs to _ci.yaml so this reusable workflow remains the single gate
  # consumed by check-result.
  ci:
    uses: ./.github/workflows/_ci.yaml
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
    secrets: inherit

  check-result:
    needs: ci
    runs-on: ubuntu-slim
    if: >-
      always() &&
      needs.ci.result != 'success'
    steps:
      - name: exit with failure
        run: exit 1
