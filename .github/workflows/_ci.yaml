on:
  workflow_call:

permissions: {}

jobs:
  # This nested reusable workflow owns test-only concurrency, so cancelling a
  # superseded test run never cancels this workflow's infrastructure plan.
  test:
    uses: $/.github/workflows/_test.yaml
    permissions:
      contents: read
    secrets: inherit

  container-build:
    # Keep the release-only push workflow honest: every production Dockerfile
    # must build on a pull request, without authenticating to GCP or pushing.
    uses: $/.github/workflows/_build-images.yaml
    permissions:
      contents: read
      packages: write
      # Workflow validation checks permissions requested by every nested job,
      # including the publish-only job which is skipped for CI builds.
      id-token: write
    with:
      push: false
    secrets: inherit
