on:
  workflow_call:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Restore Go cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: check clean
        run: make check-clean

  infrastructure-plan:
    # Fork PRs run the test job, but never receive a GCP OIDC token. This
    # condition is defence in depth; the Workload Identity Provider must also
    # restrict tokens to the air-hand-org/jobdeck repository.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: bootstrap
      command: plan
      environment: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
