name: Deploy

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: ${{ github.event.release.prerelease == false }}
    uses: $/.github/workflows/_build-images.yaml
    with:
      push: true
      image-tag: ${{ github.event.release.tag_name }}
      environment: production
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  release-dispatch:
    if: ${{ github.event.release.prerelease == false }}
    needs: images
    uses: air-hand-org/jobdeck-actions/.github/workflows/reusable-release-dispatch.yaml@56b5a3e5540b1a1d42a0dbd3ae45b48910f42e83 # v1.7.3
    with:
      service-names: job-worker,forward-proxy
    secrets: inherit
