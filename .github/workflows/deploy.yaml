name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  bootstrap:
    # Release Please publishes version releases as GitHub pre-releases. Do not
    # deploy manually-created stable releases from this workflow.
    if: ${{ github.event.release.prerelease == true }}
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: bootstrap
      command: apply
      environment: bootstrap
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  images:
    if: ${{ github.event.release.prerelease == true }}
    needs: bootstrap
    uses: ./.github/workflows/_build-images.yaml
    with:
      push: true
      image_tag: ${{ github.event.release.tag_name }}
      environment: production
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  app:
    # Keep the image push and revision apply in one release chain: app resources
    # must never refer to an Artifact Registry tag that has not been pushed.
    if: ${{ github.event.release.prerelease == true }}
    needs: images
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: app
      command: apply
      environment: production
    secrets: inherit
    permissions:
      contents: read
      id-token: write
