name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ELIGIBLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Generate from the actual Renovate head, not its synthetic merge commit.
          ref: ${{ case(env.ARTIFACT_ELIGIBLE == 'true', github.event.pull_request.head.sha, github.sha) }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@ba969be0fe03495b63e798ba2c41040bae6dd340 # v1.7.1
      - uses: air-hand-org/jobdeck-actions/actions/cache-go@ba969be0fe03495b63e798ba2c41040bae6dd340 # v1.7.1
      - name: build
        run: make build
      - name: update generated licenses
        uses: air-hand-org/jobdeck-actions/actions/auto-commit@ba969be0fe03495b63e798ba2c41040bae6dd340 # v1.7.1
        with:
          eligible: ${{ env.ARTIFACT_ELIGIBLE }}
          paths: |
            third_party/licenses/linux-amd64
          expected-head: ${{ github.event.pull_request.head.sha }}
          head-branch: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.repository.name }}
          app-client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
