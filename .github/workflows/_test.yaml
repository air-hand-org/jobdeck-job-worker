name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: jobdeck-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
      GOPRIVATE: "github.com/air-hand-org/api-contracts"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - parallel:
          - name: Restore Go cache
            uses: actions/cache@v5
            with:
              path: |
                ~/go/pkg/mod
                ~/.cache/go-build
              key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
              restore-keys: |
                go-${{ runner.os }}-
          - name: Restore NuGet cache
            uses: actions/cache@v5
            with:
              path: ~/.nuget/packages
              key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
              restore-keys: |
                nuget-${{ runner.os }}-
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - name: configure Git for GOPRIVATE modules
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf https://github.com
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: Go test
        run: make go-test
      - name: C# test
        run: make cs-test
      - name: upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: '**/playwright-traces/*.zip'
          if-no-files-found: ignore
      - name: upload Aspire resource logs
        if: ${{ failure() || runner.debug == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: aspire-resource-logs
          path: '**/TestResults/aspire-logs/*.log'
          if-no-files-found: ignore
