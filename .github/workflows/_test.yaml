name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: "github.com/air-hand-org/api-contracts"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@v1.3.0
      - name: Restore Go cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - name: configure Git for GOPRIVATE modules
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf https://github.com
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
