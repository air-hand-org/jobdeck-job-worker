name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Push images to Artifact Registry instead of only building them.
        required: false
        type: boolean
        default: false
      image_tag:
        description: Immutable image tag. Required when push is true.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by immutable release tag and must never be cancelled mid-push.
  group: build-images-${{ inputs.push && inputs.image_tag || github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

jobs:
  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # Keep pairs small enough for the hosted runner while sharing its Docker
      # layer and BuildKit cache with every following build.
      - parallel:
          - name: Build forward-proxy image
            uses: docker/build-push-action@v7
            with:
              context: containers/forward-proxy
              file: containers/forward-proxy/Dockerfile
              push: false
          - name: Build job-api image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-api/Dockerfile
              push: false
      - parallel:
          - name: Build auth image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/auth/Dockerfile
              push: false
          - name: Build job-worker image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-worker/Dockerfile
              push: false
      - parallel:
          - name: Build demo image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/demo/Dockerfile
              push: false
          - name: Build ui image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/ui/Dockerfile
              push: false

  publish:
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_REGISTRY_HOST: asia-northeast1-docker.pkg.dev
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Validate image tag
        run: test -n "$IMAGE_TAG"
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - parallel:
          - name: Build and push forward-proxy image
            uses: docker/build-push-action@v7
            with:
              context: containers/forward-proxy
              file: containers/forward-proxy/Dockerfile
              push: true
              tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-forward-proxy/forward-proxy:${{ env.IMAGE_TAG }}
          - name: Build and push job-api image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-api/Dockerfile
              push: true
              tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-job-api/job-api:${{ env.IMAGE_TAG }}
      - parallel:
          - name: Build and push auth image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/auth/Dockerfile
              push: true
              tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth/auth:${{ env.IMAGE_TAG }}
          - name: Build and push job-worker image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-worker/Dockerfile
              push: true
              tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-job-worker/job-worker:${{ env.IMAGE_TAG }}
      - parallel:
          - name: Build and push demo image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/demo/Dockerfile
              push: true
              tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-demo/demo:${{ env.IMAGE_TAG }}
          - name: Build and push ui image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/ui/Dockerfile
              push: true
              tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-ui/ui:${{ env.IMAGE_TAG }}
