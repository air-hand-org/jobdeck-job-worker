name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Publish images to Artifact Registry and GHCR instead of only building them.
        required: false
        type: boolean
        default: false
      image-tag:
        description: Immutable image tag. Required when push is true.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by immutable release tag and must never be cancelled mid-push.
  group: build-images-${{ inputs.push && inputs.image-tag || github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

permissions: {}

jobs:
  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - parallel:
        - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
          with:
            context: containers/forward-proxy
            platforms: linux/amd64
            load: true
            push: false
            tags: jobdeck-forward-proxy:test
            cache-from: type=gha,scope=forward-proxy
            cache-to: type=gha,mode=max,scope=forward-proxy
        - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
          with:
            context: .
            platforms: linux/amd64
            load: true
            push: false
            tags: jobdeck-job-worker:test
            cache-from: type=gha,scope=job-worker
            cache-to: type=gha,mode=max,scope=job-worker
      - name: Test forward-proxy allow and deny
        run: make forward-proxy-integration-test

  publish:
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      ARTIFACT_REGISTRY_HOST: asia-northeast1-docker.pkg.dev
      IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate image tag
        run: test -n "$IMAGE_TAG"
      - id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether image already exists
        id: image
        uses: air-hand-org/jobdeck-actions/actions/image-exists@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
        with:
          image: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-job-worker/job-worker:${{ env.IMAGE_TAG }}
      - name: Build and push image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-job-worker/job-worker:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=job-worker
          cache-to: type=gha,mode=max,scope=job-worker
      # Always check GHCR, including when a previous attempt already pushed to AR.
      - name: Copy image to GHCR if missing
        uses: air-hand-org/jobdeck-actions/actions/copy-image@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
        with:
          src: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-job-worker/job-worker:${{ env.IMAGE_TAG }}
          dest: ghcr.io/${{ github.repository_owner }}/jobdeck-job-worker:${{ env.IMAGE_TAG }}
      - name: Check whether proxy image already exists
        id: image-proxy
        uses: air-hand-org/jobdeck-actions/actions/image-exists@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
        with:
          image: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-forward-proxy/forward-proxy:${{ env.IMAGE_TAG }}
      - name: Build and push proxy image
        if: ${{ steps.image-proxy.outputs.exists != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: containers/forward-proxy
          platforms: linux/amd64
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-forward-proxy/forward-proxy:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=forward-proxy
          cache-to: type=gha,mode=max,scope=forward-proxy
      # Always check GHCR, including when a previous attempt already pushed to AR.
      - name: Copy proxy image to GHCR if missing
        uses: air-hand-org/jobdeck-actions/actions/copy-image@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
        with:
          src: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-forward-proxy/forward-proxy:${{ env.IMAGE_TAG }}
          dest: ghcr.io/${{ github.repository_owner }}/jobdeck-forward-proxy:${{ env.IMAGE_TAG }}
