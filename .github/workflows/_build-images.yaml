name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Push images to Artifact Registry instead of only building them.
        required: false
        type: boolean
        default: false
      image_tag:
        description: Immutable image tag. Required when push is true.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by immutable release tag and must never be cancelled mid-push.
  group: build-images-${{ inputs.push && inputs.image_tag || github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

jobs:
  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui
            dockerfile: containers/ui/Dockerfile
            context: .
          - service: auth
            dockerfile: containers/auth/Dockerfile
            context: .
          - service: job-api
            dockerfile: containers/job-api/Dockerfile
            context: .
          - service: job-worker
            dockerfile: containers/job-worker/Dockerfile
            context: .
          - service: demo
            dockerfile: containers/demo/Dockerfile
            context: .
          - service: forward-proxy
            dockerfile: containers/forward-proxy/Dockerfile
            context: containers/forward-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false

  publish:
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui
            repository: jobdeck-ui
            dockerfile: containers/ui/Dockerfile
            context: .
          - service: auth
            repository: jobdeck-auth
            dockerfile: containers/auth/Dockerfile
            context: .
          - service: job-api
            repository: jobdeck-job-api
            dockerfile: containers/job-api/Dockerfile
            context: .
          - service: job-worker
            repository: jobdeck-job-worker
            dockerfile: containers/job-worker/Dockerfile
            context: .
          - service: demo
            repository: jobdeck-demo
            dockerfile: containers/demo/Dockerfile
            context: .
          - service: forward-proxy
            repository: jobdeck-forward-proxy
            dockerfile: containers/forward-proxy/Dockerfile
            context: containers/forward-proxy
    env:
      ARTIFACT_REGISTRY_HOST: asia-northeast1-docker.pkg.dev
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
      - name: Validate image tag
        run: test -n "$IMAGE_TAG"
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ matrix.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
