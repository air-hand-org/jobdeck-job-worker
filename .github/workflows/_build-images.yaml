name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Push images to Artifact Registry instead of only building them.
        required: false
        type: boolean
        default: false
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by release ref and must never be cancelled mid-push.
  group: build-images-${{ inputs.push }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

permissions: {}

jobs:
  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - uses: docker/setup-buildx-action@v4
      # Keep pairs small enough for the hosted runner while sharing its Docker
      # layer and BuildKit cache with every following build.
      - parallel:
          - name: Build forward-proxy image
            uses: docker/build-push-action@v7
            with:
              context: containers/forward-proxy
              file: containers/forward-proxy/Dockerfile
              push: false
          - name: Build job-api image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-api/Dockerfile
              push: false
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build job-worker image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-worker/Dockerfile
              push: false
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build demo image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/demo/Dockerfile
              push: false
          - name: Build ui image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/ui/Dockerfile
              push: false
              build-args: |
                GITHUB_ACTOR=${{ github.actor }}
              secrets: |
                github_packages_token=${{ secrets.GITHUB_TOKEN }}

  publish:
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Read production image versions
        id: images
        run: |
          registry="$(yq -r '.registry' environments/production.yaml)"
          versions="$(yq -o=json -I=0 '.images' environments/production.yaml)"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "host=${registry%%/*}" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - uses: docker/setup-buildx-action@v4
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.images.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - parallel:
          - name: Build and push forward-proxy image
            uses: docker/build-push-action@v7
            with:
              context: containers/forward-proxy
              file: containers/forward-proxy/Dockerfile
              push: true
              tags: ${{ steps.images.outputs.registry }}/jobdeck-forward-proxy/forward-proxy:v${{ fromJSON(steps.images.outputs.versions)['forward-proxy'].version }}
          - name: Build and push job-api image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/job-api/Dockerfile
              push: true
              tags: ${{ steps.images.outputs.registry }}/jobdeck-job-api/job-api:v${{ fromJSON(steps.images.outputs.versions)['job-api'].version }}
              secrets: |
                github_contents_token=${{ steps.app-token.outputs.token }}
      - name: Build and push job-worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/job-worker/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.registry }}/jobdeck-job-worker/job-worker:v${{ fromJSON(steps.images.outputs.versions)['job-worker'].version }}
          secrets: |
            github_contents_token=${{ steps.app-token.outputs.token }}
      - parallel:
          - name: Build and push demo image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/demo/Dockerfile
              push: true
              tags: ${{ steps.images.outputs.registry }}/jobdeck-demo/demo:v${{ fromJSON(steps.images.outputs.versions).demo.version }}
          - name: Build and push ui image
            uses: docker/build-push-action@v7
            with:
              context: .
              file: containers/ui/Dockerfile
              push: true
              tags: ${{ steps.images.outputs.registry }}/jobdeck-ui/ui:v${{ fromJSON(steps.images.outputs.versions).ui.version }}
              build-args: |
                GITHUB_ACTOR=${{ github.actor }}
              secrets: |
                github_packages_token=${{ secrets.GITHUB_TOKEN }}
