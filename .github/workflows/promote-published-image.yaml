name: Promote published image

on:
  repository_dispatch:
    types:
      - image-published

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@v1.2.0

      - name: Validate the dispatched image promotion
        id: payload
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const normalize = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/normalize-image-promotion-payload.js`);
            const outputs = normalize(context.payload.client_payload);
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, value);
            }

      - name: Update the managed service image versions
        id: image
        run: |
          while IFS= read -r service; do
            export SERVICE="$service"
            if ! yq -e '.images | has(strenv(SERVICE))' environments/production.yaml >/dev/null; then
              echo "Service is not managed in environments/production.yaml: $SERVICE" >&2
              exit 1
            fi
            yq -i '.images[strenv(SERVICE)].version = strenv(VERSION)' \
              environments/production.yaml
          done < <(jq -r '.[]' <<< "$SERVICES")
        env:
          SERVICES: ${{ steps.payload.outputs.services }}
          VERSION: ${{ steps.payload.outputs.version }}

      - name: Create or update promotion PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: image-promotion/${{ steps.payload.outputs.serviceSlug }}-${{ steps.payload.outputs.version }}
          delete-branch: true
          commit-message: "fix(images): promote ${{ steps.payload.outputs.serviceNames }} to ${{ steps.payload.outputs.tag }}"
          title: "fix(images): promote ${{ steps.payload.outputs.serviceNames }} to ${{ steps.payload.outputs.tag }}"
          body: |
            Updates the managed `${{ steps.payload.outputs.serviceNames }}` images to `${{ steps.payload.outputs.tag }}`.

            Source release: ${{ github.event.client_payload.release_url }}
