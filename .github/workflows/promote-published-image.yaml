name: Promote published image

on:
  repository_dispatch:
    types:
      - image-published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.service }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools

      - name: Update the managed service image version
        id: image
        run: |
          if [[ ! "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid service name: $SERVICE" >&2
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Image tag must be a v-prefixed semantic version: $TAG" >&2
            exit 1
          fi

          if ! yq -e '.images | has(strenv(SERVICE))' environments/production.yaml >/dev/null; then
            echo "Service is not managed in environments/production.yaml: $SERVICE" >&2
            exit 1
          fi

          version="${TAG#v}"
          export VERSION="$version"
          yq -i '.images[strenv(SERVICE)].version = strenv(VERSION)' \
            environments/production.yaml
          {
            echo "service=$SERVICE"
            echo "tag=$TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}

      - name: Create or update promotion PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: image-promotion/${{ steps.image.outputs.service }}-${{ steps.image.outputs.version }}
          delete-branch: true
          commit-message: "fix(${{ steps.image.outputs.service }}): promote image to ${{ steps.image.outputs.tag }}"
          title: "fix(${{ steps.image.outputs.service }}): promote image to ${{ steps.image.outputs.tag }}"
          body: |
            Updates the managed `${{ steps.image.outputs.service }}` image to `${{ steps.image.outputs.tag }}`.

            Source release: ${{ github.event.client_payload.release_url }}
